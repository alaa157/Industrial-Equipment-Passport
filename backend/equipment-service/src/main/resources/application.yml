server:
  port: 8082
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: equipment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/passport_equipment}
    username: ${SPRING_DATASOURCE_USERNAME:industrial}
    password: ${SPRING_DATASOURCE_PASSWORD:industrial_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:industrial}
    password: ${RABBITMQ_PASSWORD:rabbitmq_dev_password}

jwt:
  secret: ${JWT_SECRET}

file:
  storage-path: ${FILE_STORAGE_PATH:/app/storage}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
