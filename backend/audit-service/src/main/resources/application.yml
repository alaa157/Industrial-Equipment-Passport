server:
  port: 8085
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/passport_audit}
    username: ${SPRING_DATASOURCE_USERNAME:industrial}
    password: ${SPRING_DATASOURCE_PASSWORD:industrial_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:industrial}
    password: ${RABBITMQ_PASSWORD:rabbitmq_dev_password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
