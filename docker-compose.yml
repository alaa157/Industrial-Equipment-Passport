services:
  auth-service:
    build: ./backend/auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
      SPRING_DATASOURCE_URL: ${AUTH_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration-auth:
        condition: service_completed_successfully

  equipment-service:
    build: ./backend/equipment-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
      SPRING_DATASOURCE_URL: ${EQUIPMENT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_equipment}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration-equipment:
        condition: service_completed_successfully

  maintenance-service:
    build: ./backend/maintenance-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH}
      SPRING_DATASOURCE_URL: ${MAINTENANCE_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_maintenance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration-maintenance:
        condition: service_completed_successfully

  notification-service:
    build: ./backend/notification-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_notification}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration-notification:
        condition: service_completed_successfully

  audit-service:
    build: ./backend/audit-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: ${AUDIT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_audit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migration-audit:
        condition: service_completed_successfully

  api-gateway:
    build: ./backend/api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      EQUIPMENT_SERVICE_URL: ${EQUIPMENT_SERVICE_URL:-http://equipment-service:8082}
      MAINTENANCE_SERVICE_URL: ${MAINTENANCE_SERVICE_URL:-http://maintenance-service:8083}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8084}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit-service:8085}
    depends_on:
      auth-service:
        condition: service_healthy
      equipment-service:
        condition: service_healthy
      maintenance-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  migration-auth:
    build: ./backend/auth-service
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_DATASOURCE_URL: ${AUTH_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migration-equipment:
    build: ./backend/equipment-service
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_DATASOURCE_URL: ${EQUIPMENT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_equipment}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migration-maintenance:
    build: ./backend/maintenance-service
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_DATASOURCE_URL: ${MAINTENANCE_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_maintenance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migration-notification:
    build: ./backend/notification-service
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_notification}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migration-audit:
    build: ./backend/audit-service
    restart: "no"
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      SPRING_DATASOURCE_URL: ${AUDIT_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/passport_audit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-industrial}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-passport_auth}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-industrial}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-industrial-passport}-internal

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
