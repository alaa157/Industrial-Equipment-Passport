server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: equipment-service
          uri: ${EQUIPMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/equipment/**
        - id: maintenance-service
          uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/maintenance/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/audit/**
        - id: auth-service-users
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/**
        - id: maintenance-service-technicians
          uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/technicians/**

security:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
